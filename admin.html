<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURENAR — Admin</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>body{background:#efeee9}.admin-shell{min-height:100vh}.admin-top{height:76px;background:#f6f6f4;border-bottom:1px solid #d9d6d0;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.admin-title{font-family:var(--serif);font-size:28px}.admin-actions{display:flex;gap:15px}.admin-actions button,.admin-actions a{border:1px solid var(--ink);background:transparent;padding:10px 14px;font-size:9px;letter-spacing:.13em}.admin-main{padding:50px 4vw;max-width:1400px;margin:auto}.admin-login{max-width:430px;margin:12vh auto}.admin-login h1,.dashboard h1{font-family:var(--serif);font-size:58px;font-weight:400;line-height:.9;margin:0 0 15px}.admin-card{background:#f6f6f4;border:1px solid #d9d6d0;padding:28px}.admin-form{display:grid;gap:5px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;border:1px solid #cbc7c0;background:#fff;padding:13px;outline:none}.admin-form textarea{min-height:110px;resize:vertical}.admin-form label{font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-top:12px}.admin-form .primary-btn{margin-top:15px}.form-message{color:#9a2f25;font-size:11px}.dashboard-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.dashboard-grid{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:25px}.product-table{background:#f6f6f4;border:1px solid #d9d6d0}.table-head,.admin-product{display:grid;grid-template-columns:1.4fr .6fr .5fr .55fr auto;gap:12px;align-items:center;padding:15px 18px}.table-head{font-size:8px;letter-spacing:.14em;color:#777;border-bottom:1px solid #d9d6d0}.admin-product{border-bottom:1px solid #d9d6d0;font-size:11px}.admin-product:last-child{border-bottom:0}.status-pill{font-size:8px;letter-spacing:.1em;text-transform:uppercase}.status-pill.off{color:#9a2f25}.admin-product-actions{display:flex;gap:5px;justify-content:flex-end}.small-btn{border:1px solid #bbb6ae;background:transparent;padding:8px 9px;font-size:8px;letter-spacing:.08em}.small-btn.danger{border-color:#9a2f25;color:#9a2f25}.small-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}.image-help{color:#777;font-size:10px;line-height:1.5;margin:0}.check-row{display:flex;align-items:center;gap:10px;margin:12px 0}.check-row input{width:auto}.admin-preview{width:55px;height:68px;object-fit:cover;background:#ddd}.empty-admin{padding:45px;text-align:center;color:#777}@media(max-width:1000px){.dashboard-grid{grid-template-columns:1fr}.table-head{display:none}.admin-product{grid-template-columns:55px 1fr auto}.admin-product>div:nth-child(2),.admin-product>div:nth-child(3),.admin-product>div:nth-child(4){display:none}.admin-product-actions{grid-column:3}.dashboard-head{display:block}.dashboard-head .admin-actions{margin-top:20px}}@media(max-width:600px){.admin-main{padding:30px 18px}.admin-top{padding:0 18px}.admin-title{font-size:22px}.admin-actions a{display:none}.admin-login h1,.dashboard h1{font-size:48px}.admin-card{padding:20px}.admin-product{padding:12px}.admin-preview{width:45px;height:58px}}</style></head>
<body><div id="app"></div><script type="module" src="/admin.js"></script></body></html>
