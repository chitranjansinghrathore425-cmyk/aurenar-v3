<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>AURENAR — Product</title>

  <meta name="description" content="AURENAR product detail">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">

  <script type="module" src="/product.js"></script>
</head>

<body>

  <div class="announcement">
    Complimentary shipping on orders over ₹2,500
  </div>


  <!-- HEADER -->

  <header class="site-header">

    <button
      class="mobile-menu"
      id="menuBtn"
      aria-label="Open menu"
    >
      <span></span>
      <span></span>
    </button>

    <a
      href="/"
      class="wordmark"
      aria-label="AURENAR home"
    >
      AURENAR
    </a>

    <nav class="desktop-nav">

      <a href="/#shop">SHOP</a>

      <a
        href="/#shop"
        data-filter="women"
      >
        WOMEN
      </a>

      <a
        href="/#shop"
        data-filter="men"
      >
        MEN
      </a>

      <a href="/#collections">
        COLLECTIONS
      </a>

    </nav>


    <div class="header-actions">

      <!-- SEARCH -->

      <button
        class="icon-action"
        id="searchBtn"
        aria-label="Search"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M16 16l5 5"></path>
        </svg>
      </button>


      <!-- ACCOUNT -->

      <button
        class="icon-action"
        id="accountBtn"
        aria-label="Account"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 21c.7-4 3-6 7-6s6.3 2 7 6"></path>
        </svg>
      </button>


      <!-- WISHLIST -->

      <button
        class="icon-action"
        id="wishlistBtn"
        aria-label="Wishlist"
      >
        <svg viewBox="0 0 24 24">
          <path d="M20.8 8.7c0 5.2-8.8 10.3-8.8 10.3S3.2 13.9 3.2 8.7C3.2 5.8 5.3 4 7.8 4c1.7 0 3.3.9 4.2 2.3C12.9 4.9 14.5 4 16.2 4c2.5 0 4.6 1.8 4.6 4.7Z"></path>
        </svg>
      </button>


      <!-- BAG -->

      <button
        class="icon-action bag-action"
        id="bagBtn"
        aria-label="Shopping bag"
      >

        <svg viewBox="0 0 24 24">
          <path d="M5 8h14l-1 13H6L5 8Z"></path>
          <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
        </svg>

        <span id="bagCount">0</span>

      </button>

    </div>

  </header>


  <!-- MOBILE NAV -->

  <div
    class="mobile-nav"
    id="mobileNav"
    aria-hidden="true"
  >

    <a href="/#shop">SHOP</a>

    <a
      href="/#shop"
      data-filter="women"
    >
      WOMEN
    </a>

    <a
      href="/#shop"
      data-filter="men"
    >
      MEN
    </a>

    <a href="/#collections">
      COLLECTIONS
    </a>

    <a href="/#about">
      ABOUT
    </a>

  </div>


  <!-- PRODUCT -->

  <main>

    <section
      class="product-detail"
      id="productDetail"
    >

      <div class="status">
        Loading product…
      </div>

    </section>

  </main>


  <!-- OVERLAY -->

  <div
    class="overlay"
    id="overlay"
    hidden
  ></div>


  <!-- BAG DRAWER -->

  <aside
    class="drawer"
    id="bagDrawer"
    aria-hidden="true"
  >

    <div class="drawer-head">

      <h2>Your bag</h2>

      <button
        class="close-btn"
        data-close="bagDrawer"
        aria-label="Close bag"
      >
        ×
      </button>

    </div>

    <div
      class="drawer-body"
      id="bagBody"
    ></div>

    <div
      class="drawer-foot"
      id="bagFoot"
    ></div>

  </aside>


  <!-- ACCOUNT DRAWER -->

  <aside
    class="drawer drawer--wide"
    id="accountDrawer"
    aria-hidden="true"
  >

    <div class="drawer-head">

      <h2>Account</h2>

      <button
        class="close-btn"
        data-close="accountDrawer"
        aria-label="Close account"
      >
        ×
      </button>

    </div>

    <div
      class="drawer-body"
      id="accountBody"
    ></div>

  </aside>


  <!-- SEARCH DRAWER -->

  <aside
    class="drawer drawer--wide"
    id="searchDrawer"
    aria-hidden="true"
  >

    <div class="drawer-head">

      <h2>Search</h2>

      <button
        class="close-btn"
        data-close="searchDrawer"
        aria-label="Close search"
      >
        ×
      </button>

    </div>

    <div class="search-wrap">

      <input
        id="searchInput"
        type="search"
        placeholder="Search the collection"
        autocomplete="off"
      >

      <div id="searchResults"></div>

    </div>

  </aside>


  <!-- CHECKOUT DRAWER -->

  <aside
    class="drawer drawer--checkout"
    id="checkoutDrawer"
    aria-hidden="true"
  >

    <div class="drawer-head">

      <h2>Checkout</h2>

      <button
        class="close-btn"
        data-close="checkoutDrawer"
        aria-label="Close checkout"
      >
        ×
      </button>

    </div>

    <div class="drawer-body">

      <form
        id="checkoutForm"
        class="checkout-form"
      >

        <p class="eyebrow">
          CONTACT
        </p>

        <input
          required
          name="email"
          type="email"
          placeholder="Email address"
        >

        <p class="eyebrow">
          SHIPPING ADDRESS
        </p>

        <div class="two-col">

          <input
            required
            name="firstName"
            placeholder="First name"
          >

          <input
            required
            name="lastName"
            placeholder="Last name"
          >

        </div>

        <input
          required
          name="address"
          placeholder="Address"
        >

        <div class="two-col">

          <input
            required
            name="city"
            placeholder="City"
          >

          <input
            required
            name="postal"
            inputmode="numeric"
            placeholder="PIN code"
          >

        </div>

        <input
          name="phone"
          inputmode="tel"
          placeholder="Phone number"
        >

        <div
          class="checkout-summary"
          id="checkoutSummary"
        ></div>

        <div class="payment-note">

          <strong>
            Payment
          </strong>

          <p>
            Online payment is not connected yet.
            No payment will be processed.
          </p>

        </div>

        <button
          type="submit"
          class="primary-btn"
          disabled
        >
          PAYMENT — COMING SOON
        </button>

      </form>

    </div>

  </aside>


  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

</body>
</html>
