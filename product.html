<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>AURENAR — Product</title>
  <meta name="description" content="AURENAR product detail">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/product.js"></script>
</head>

<body>

  <div class="announcement">
    Complimentary shipping on orders over ₹2,500
  </div>

  <header class="site-header">

    <a class="wordmark" href="/" aria-label="AURENAR home">
      AURENAR
    </a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="/#shop">SHOP</a>
      <a href="/#shop" data-filter="women">WOMEN</a>
      <a href="/#shop" data-filter="men">MEN</a>
      <a href="/#collections">COLLECTIONS</a>
    </nav>

    <div class="header-actions">
      <button class="text-action" id="searchBtn">SEARCH</button>
      <button class="text-action" id="accountBtn">ACCOUNT</button>
      <button class="text-action bag-action" id="bagBtn">
        BAG (<span id="bagCount">0</span>)
      </button>
    </div>

  </header>

  <main>

    <section class="product-detail" id="productDetail">
      <div class="status">
        Loading product…
      </div>
    </section>

  </main>

  <div class="overlay" id="overlay" hidden></div>

  <aside class="drawer" id="bagDrawer" aria-hidden="true">

    <div class="drawer-head">
      <h2>Your bag</h2>
      <button class="close-btn" data-close="bagDrawer">×</button>
    </div>

    <div class="drawer-body" id="bagBody"></div>

    <div class="drawer-foot" id="bagFoot"></div>

  </aside>

  <aside class="drawer drawer--wide" id="accountDrawer" aria-hidden="true">

    <div class="drawer-head">
      <h2>Account</h2>
      <button class="close-btn" data-close="accountDrawer">×</button>
    </div>

    <div class="drawer-body" id="accountBody"></div>

  </aside>

  <aside class="drawer drawer--wide" id="searchDrawer" aria-hidden="true">

    <div class="drawer-head">
      <h2>Search</h2>
      <button class="close-btn" data-close="searchDrawer">×</button>
    </div>

    <div class="search-wrap">

      <input
        id="searchInput"
        type="search"
        placeholder="Search the collection"
      >

      <div id="searchResults"></div>

    </div>

  </aside>

  <aside class="drawer drawer--checkout" id="checkoutDrawer" aria-hidden="true">

    <div class="drawer-head">
      <h2>Checkout</h2>
      <button class="close-btn" data-close="checkoutDrawer">×</button>
    </div>

    <div class="drawer-body">

      <form id="checkoutForm" class="checkout-form">

        <p class="eyebrow">CONTACT</p>

        <input
          required
          name="email"
          type="email"
          placeholder="Email address"
        >

        <p class="eyebrow">SHIPPING ADDRESS</p>

        <div class="two-col">

          <input
            required
            name="firstName"
            placeholder="First name"
          >

          <input
            required
            name="lastName"
            placeholder="Last name"
          >

        </div>

        <input
          required
          name="address"
          placeholder="Address"
        >

        <div class="two-col">

          <input
            required
            name="city"
            placeholder="City"
          >

          <input
            required
            name="postal"
            inputmode="numeric"
            placeholder="PIN code"
          >

        </div>

        <input
          name="phone"
          inputmode="tel"
          placeholder="Phone number"
        >

        <div
          class="checkout-summary"
          id="checkoutSummary">
        </div>

        <div class="payment-note">

          <strong>Payment</strong>

          <p>
            Online payment is not connected yet.
            No payment will be processed in V3.
          </p>

        </div>

        <button
          type="submit"
          class="primary-btn"
          disabled>
          PAYMENT — COMING SOON
        </button>

      </form>

    </div>

  </aside>

  <div
    class="toast"
    id="toast">
  </div>

</body>
</html>
